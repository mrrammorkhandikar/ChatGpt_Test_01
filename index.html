<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Shriram & Team — web, mobile, desktop, AI and UI/UX product development."/>
<title>Shriram & Team — Build · Automate · Scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="style.css">
</head><body><div id="root"></div>
<script type="text/babel">
const {useState}=React;
const projects=[
["Legal Assist Platform","AI + Web","AI-powered platform for law firms with document management, task assignment and firm knowledge chatbot.",["Next.js","FastAPI","PostgreSQL"],"legal"],
["TaskFlow Pro","Web + Mobile","Employee task management system with web dashboard and Android app.",["React","Node.js","MongoDB"],"mobile"],
["Firm Knowledge Chatbot","AI + Web","RAG-based chatbot with document access controls, admin panel and team workspaces.",["Python","FastAPI","Vector DB"],"ai"],
["SocialConnect","Web + Mobile","Social media platform with posts, messaging, groups, notifications and content moderation.",["Next.js","Socket.io","PostgreSQL"],"mobile"],
["Healthcare Booking","Web","Doctor appointment platform with payments, dashboards and notifications.",["React","Node.js","MySQL"],"web"],
["Business Automation Tool","Desktop","Custom desktop application for business data processing, reporting and automation.",["Python","PyQt","SQLite"],"desktop"],
["LearnHub","Web","Education platform with courses, assessments, payments and admin content management.",["Next.js","PostgreSQL","APIs"],"web"],
["PropertyDesk","Web","Real-estate CRM for leads, properties, agents, visits and pipeline reporting.",["React","Node.js","SQL"],"web"],
["HR Pulse","Web + Mobile","Employee portal for profiles, leave, attendance, tasks and manager approvals.",["React","Node.js","MongoDB"],"mobile"],
["Vision QA","AI + Web","Computer-vision review workflow for image/video annotation and quality dashboards.",["PyTorch","FastAPI","CV"],"ai"],
["MarketCart","Web","E-commerce system with catalog, inventory, checkout and order operations.",["Next.js","Stripe","PostgreSQL"],"web"],
["NGO Connect","Web","Campaigns, donations, volunteers, events, stories and reporting.",["React","Node.js","PostgreSQL"],"web"],
["FinanceFlow","Web","Invoices, expenses, approvals, dashboards and exportable reporting.",["React","Python","SQL"],"web"],
["TravelMate","Mobile","Trip planning, shared itineraries, saved places and notifications.",["Flutter","Firebase","APIs"],"mobile"],
["MediaDesk","Web","Editorial publishing, moderation, media library, search and analytics.",["Next.js","PostgreSQL","CMS"],"web"]
];
const services=[
["◉","Web Development","Modern, scalable and responsive web applications for any industry."],
["▯","Mobile App Development","Android & cross-platform apps with great performance and UI/UX."],
["✣","AI & Automation","AI chatbots, RAG, automation tools, data processing and LLM integrations."],
["◈","UI/UX Design","User-focused, modern and conversion-driven product design."],
["▱","Desktop Applications","Custom desktop tools for business operations and internal workflows."],
["◌","Consulting & Support","Technical consulting, maintenance, QA and long-term support."]
];
const industries=["⚖ Legal & Law Firms","♡ Healthcare","⌁ Education","▥ Business & Corporate","♧ Social & Community","🛒 E-commerce","♡ NGO & Non-profit","◉ Finance & Accounting","⌂ Real Estate","✈ Travel & Hospitality","▣ Media & Content","⚙ Custom Solutions"];
const team=[["SM","Shriram M.","AI / GenAI · Full-Stack"],["FE","Full-Stack","Web & Backend"],["UX","UI/UX","Product Design"],["MB","Mobile Apps","Android & Cross-platform"],["AI","AI/ML","RAG & Automation"],["QA","Testers & QA","Quality & Release"],["PM","Project Manager","Planning & Delivery"]];
function Header({page}){return <header className="nav"><a className="brand" href="#/home"><span>SM</span><div><b>Shriram & Team</b><small>Build · Automate · Scale</small></div></a><nav>{["home","about","services","projects","industries","process","team","contact"].map(x=><a className={page===x?"active":""} href={"#/"+x}>{x[0].toUpperCase()+x.slice(1)}</a>)}</nav><a className="top-cta" href="#/contact">Let's Build <span>→</span></a></header>}
function Hero(){return <section className="hero"><div className="hero-copy"><div className="pill">Full-Stack · AI · Web · Mobile · Desktop</div><h1>Your Idea.<br/><em>Our Team.</em><br/>Real Solutions.</h1><p>We build modern web, mobile, desktop and AI solutions for businesses, startups and individuals — across any industry.</p><div className="actions"><a className="btn orange" href="#/contact">Start a Project <span>→</span></a><a className="btn ghost" href="#/projects">View Our Work</a></div><div className="trusted"><div className="faces">{["SM","FE","UX","AI"].map(x=><i>{x}</i>)}</div><span>Trusted by startups, businesses<br/>and professionals worldwide.</span></div></div><div className="hero-person"><div className="glow"></div><img src="profile_professional.jpg" alt="Shriram Morkhandikar"/><div className="person-card"><b>Shriram Morkhandikar</b><small>AI / GenAI · Full-Stack · Team Lead</small><span></span></div><div className="scribble">Let's build,<br/>something great<br/>together ↗</div></div><div className="cap-list">{["Web Applications","Mobile Applications","AI & Automation","Desktop Applications","UI/UX Design","Cloud & Deployment"].map((x,i)=><div><strong>{["▣","▯","✣","▱","◈","⌂"][i]}</strong>{x}</div>)}</div></section>}
function Stats(){return <section className="stats">{[["▣","15+","Projects","Delivered"],["♡","10+","Happy Clients",""],["▤","5+","Industries",""],["▱","3+","Years","Experience"]].map(x=><div><b>{x[0]}</b><strong>{x[1]}</strong><span>{x[2]}<br/>{x[3]}</span></div>)}</section>}
function Services(){return <section className="section"><div className="section-title"><div><h2>What We Do</h2><p>End-to-end digital solutions, from idea to deployment.</p></div><a className="small-btn" href="#/services">View All Services →</a></div><div className="service-grid">{services.map(x=><article><b>{x[0]}</b><h3>{x[1]}</h3><p>{x[2]}</p></article>)}</div></section>}
function ProjectCard({p,i}){return <article className="project"><div className={"mock m"+((i%6)+1)}><span>{p[1]}</span><div className="mock-ui"><b>{p[0]}</b><i></i><i></i><i></i></div></div><div className="project-info"><small>{p[1]}</small><h3>{p[0]}</h3><p>{p[2]}</p><div>{p[3].map(t=><span>{t}</span>)}<b>→</b></div></div></article>}
function Projects(){const [filter,setFilter]=useState("all");let shown=projects.filter(p=>filter==="all"||p[4]===filter);return <section className="section projects"><div className="section-title"><div><h2>Featured Projects <small>15+ product directions</small></h2></div><div className="filters">{["all","web","mobile","ai","desktop"].map(x=><button className={filter===x?"active":""} onClick={()=>setFilter(x)}>{x==="all"?"All":x==="mobile"?"Mobile Apps":x==="ai"?"AI & Automation":x==="desktop"?"Desktop Apps":"Web Apps"}</button>)}</div><a className="small-btn" href="#/projects">View All Projects →</a></div><div className="project-grid">{shown.slice(0,6).map((p,i)=><ProjectCard p={p} i={i}/>)}</div></section>}
function Industries(){return <section className="section industries"><div className="section-title"><div><h2>Industries We Work With</h2><p>We build solutions for any industry — here are some examples.</p></div><a className="small-btn" href="#/industries">Explore Industries →</a></div><div className="industry-grid">{industries.map(x=><div>{x}</div>)}</div></section>}
function Process(){return <section className="bottom-grid"><div className="process"><div className="section-title"><div><h2>Our Process</h2><p>A simple and transparent process to turn your idea into a successful product.</p></div></div><div className="process-row">{[["01","Explore & Plan","Understand requirements, goals and create a clear plan."],["02","Design & Prototype","Create UI/UX designs and interactive prototypes."],["03","Develop & Test","Agile development with regular updates and testing."],["04","Deploy & Support","Launch and provide ongoing support."]].map(x=><div><b>{x[0]}</b><h3>{x[1]}</h3><p>{x[2]}</p></div>)}</div></div><div className="team-mini"><h2>Meet Our Team</h2><p>A skilled team working together to deliver quality solutions.</p><div className="team-row">{team.map(x=><div><i>{x[0]}</i><small>{x[1]}<br/>{x[2]}</small></div>)}</div></div><aside className="contact-card"><h2>Let's Work Together</h2><p>Have a project idea or want to discuss a custom solution? We'd love to hear from you.</p><a className="btn orange" href="#/contact">Start a Project →</a><a className="btn ghost" href="mailto:rammorkhandikar@gmail.com">✉ Contact Us</a></aside></section>}
function Home(){return <><Hero/><Stats/><Services/><Projects/><Industries/><Process/></>}
function Page({type,title,desc,children}){return <><section className="page-head"><span>SHRIRAM & TEAM · {type.toUpperCase()}</span><h1>{title}</h1><p>{desc}</p></section><section className="page-content">{children}</section></>}
function App(){const page=(location.hash.replace("#/","")||"home");const set=page;let content=<Home/>;if(page==="about")content=<Page type="About" title={<>A flexible team for <em>serious digital work.</em></>} desc="Design, engineering, AI, mobile, desktop and delivery capabilities brought together around the problem."><div className="two-col"><div><h2>Built around the product, not a fixed agency package.</h2><p>We can stay lean for a focused website or assemble specialists for a business platform, mobile application, desktop utility or AI knowledge system.</p><p>Our work spans user experience, full-stack development, APIs, data, RAG, automation, testing and deployment.</p></div><img className="about-img" src="profile_professional.jpg"/></div></Page>;if(page==="services")content=<Page type="Services" title={<>Everything from <em>interface to infrastructure.</em></>} desc="Choose one service or assemble an end-to-end product team."><div className="large-grid">{services.concat([["⌘","Cloud & Deployment","Production configuration, APIs, environments, Docker, analytics and release support."],["◎","Business Software","Role-based portals, task systems, dashboards, approvals, reporting and automation."]]).map(x=><article className="big-card"><b>{x[0]}</b><h2>{x[1]}</h2><p>{x[2]}</p></article>)}</div></Page>;if(page==="projects")content=<Page type="Projects" title={<>15 product directions. <em>Built to solve real workflows.</em></>} desc="Web, mobile, AI, desktop and business systems."><div className="all-projects">{projects.map((p,i)=><ProjectCard p={p} i={i}/>)}</div></Page>;if(page==="industries")content=<Page type="Industries" title={<>Different sectors. <em>Same engineering discipline.</em></>} desc="We adapt identity, data, workflows, dashboards, automation and interfaces to the business."><div className="industry-large">{industries.map(x=><article><b>{x}</b><p>Custom workflows, responsive interfaces, secure roles, APIs, dashboards and support shaped around this sector.</p></article>)}</div></Page>;if(page==="process")content=<Page type="Process" title={<>A clear path from <em>idea to production.</em></>} desc="Simple, transparent and reviewable."><div className="steps-large">{[["01","Explore & Plan"],["02","Design & Prototype"],["03","Develop & Test"],["04","Deploy & Support"]].map(x=><article><b>{x[0]}</b><h2>{x[1]}</h2><p>Requirements, user flows, technical architecture, implementation, testing, deployment and ongoing support with visible milestones.</p></article>)}</div></Page>;if(page==="team")content=<Page type="Team" title={<>The right specialists for <em>each product.</em></>} desc="A focused delivery team across design, engineering, AI, mobile, QA and project coordination."><div className="team-large">{team.map(x=><article><i>{x[0]}</i><h2>{x[1]}</h2><b>{x[2]}</b><p>Specialist capability available as part of the project team.</p></article>)}</div></Page>;if(page==="contact")content=<Page type="Contact" title={<>Let's turn your idea into <em>something useful.</em></>} desc="Tell us what you want to build, what exists today and what success looks like."><div className="contact-large"><div><h2>Start a project</h2><p>Website, web application, Android app, desktop tool, AI assistant or ongoing development.</p><a className="btn orange" href="mailto:rammorkhandikar@gmail.com">Email the team →</a><p className="contact-links">rammorkhandikar@gmail.com<br/>+91 7218860925</p></div><form onSubmit={e=>{e.preventDefault();location.href="mailto:rammorkhandikar@gmail.com?subject=Project%20Enquiry&body="+encodeURIComponent(e.target.message.value)}}><input placeholder="Your name"/><input placeholder="Your email" type="email"/><select><option>Web Application</option><option>Mobile Application</option><option>AI / RAG</option><option>Desktop Application</option><option>UI/UX</option></select><textarea name="message" placeholder="Tell us about your project..."></textarea><button className="btn orange">Send Project Brief →</button></form></div></Page>;return <><Header page={set}/><main>{content}</main><footer><b>Shriram & Team</b><span>Web · AI · Mobile · Desktop · UI/UX</span><a href="#/contact">Start a project →</a></footer></>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
